# Stage 0: build the NativeAOT core, run the probe homebrew through it on a Windows runner and report memory.
name: Build core

on:
  push:
    branches: [xbox]
  workflow_dispatch:

permissions:
  contents: read

env:
  # LibHac source mirror of git.ryujinx.app/projects/LibHac. aa8a40f is the last commit
  # before 2026-09; code-wise it matches 0.21.0-alpha.133, which Directory.Packages.props pins.
  LIBHAC_REPO: https://starforgejo.dev/archive/LibHac_Ryubing.git
  LIBHAC_SHA: aa8a40f410f7b9fc7b6eee5107bf66821d0ecef6
  LIBHAC_VERSION: 0.21.0-alpha.133
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  probe:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: xbox/homebrew

      - name: Build xbc-probe.nro
        run: make -C xbox/homebrew/xbc-probe

      - uses: actions/upload-artifact@v4
        with:
          name: xbc-probe
          path: xbox/homebrew/xbc-probe/xbc-probe.nro
          retention-days: 7

  core:
    needs: probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack LibHac from source
        shell: bash
        # Outside the workspace: Ryujinx's Directory.Packages.props would otherwise apply to LibHac.
        run: |
          git init -q "$RUNNER_TEMP/libhac" && cd "$RUNNER_TEMP/libhac"
          git fetch -q --depth 1 "$LIBHAC_REPO" "$LIBHAC_SHA"
          git checkout -q FETCH_HEAD
          dotnet pack src/LibHac/LibHac.csproj -c Release \
            -p:Version="$LIBHAC_VERSION" -p:ContinuousIntegrationBuild=true \
            -o "$GITHUB_WORKSPACE/localfeed"

      - name: Publish core (NativeAOT, win-x64)
        run: dotnet publish src/Ryujinx.Xbox.Core -c Release -r win-x64 -o core-out

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build corehost
        run: cl /nologo /O2 /W3 xbox\corehost\corehost.c /Fe:core-out\corehost.exe

      - uses: actions/download-artifact@v4
        with:
          name: xbc-probe
          path: probe

      - name: Run probe (host mapped unsafe)
        shell: bash
        run: core-out/corehost.exe "$PWD/core-out/Ryujinx.Xbox.Core.dll" "$RUNNER_TEMP/xbc-data" "$PWD/probe/xbc-probe.nro" 45 2 | tee run-mode2.txt

      - name: Run probe (software page table)
        if: always()
        shell: bash
        run: core-out/corehost.exe "$PWD/core-out/Ryujinx.Xbox.Core.dll" "$RUNNER_TEMP/xbc-data-sw" "$PWD/probe/xbc-probe.nro" 60 0 | tee run-mode0.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbc-core-win-x64
          path: |
            core-out/Ryujinx.Xbox.Core.dll
            core-out/corehost.exe
            run-mode*.txt
          retention-days: 7
